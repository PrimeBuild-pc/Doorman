services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: doorman
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-doorman}
      POSTGRES_DB: doorman
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doorman"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  bot:
    build: .
    image: ghcr.io/primebuild-pc/doorman:latest
    environment:
      SERVICE: bot
      DATABASE_URL: postgresql://doorman:${POSTGRES_PASSWORD:-doorman}@db:5432/doorman
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET}
      AUTH_SECRET: ${AUTH_SECRET}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      UPLOADS_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: .
    image: ghcr.io/primebuild-pc/doorman:latest
    environment:
      SERVICE: web
      DATABASE_URL: postgresql://doorman:${POSTGRES_PASSWORD:-doorman}@db:5432/doorman
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET}
      AUTH_SECRET: ${AUTH_SECRET}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      UPLOADS_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    ports:
      - "${DOORMAN_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db-data:
  uploads:
